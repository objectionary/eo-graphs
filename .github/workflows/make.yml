---
# yamllint disable rule:line-length
name: make
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: make-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 tests/check_85.py
      - run: python3 tests/check_62.py
      - run: python3 tests/check_72.py
      - run: python3 tests/check_83.py
      - run: npm install -g eolang
      - run: make
      - run: python3 tests/check_57.py
  telegram:
    needs: make
    runs-on: ubuntu-26.04
    if: ${{ always() && github.event_name == 'push' }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@9d7c20b6538e9dcfdadc25dfc493cd57ea1b1f7c  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
