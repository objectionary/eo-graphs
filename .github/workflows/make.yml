---
# yamllint disable rule:line-length
name: make
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: make-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: npm install -g eolang
      - run: make
  telegram:
    needs: make
    runs-on: ubuntu-26.04
    if: ${{ always() && github.event_name == 'push' }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@7eab5af7f08c1df4b8edd6bd48fdb587918c26ff  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
